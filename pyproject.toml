[project]
name = "simpleupset"
version = "0.1.0"
description = "UpSet plots with a simple interface: pass a dict of sets, get a plot."
readme = "README.md"
authors = [
    { name = "claude", email = "claude@paulsaary.de" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
