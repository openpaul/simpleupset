[project]
name = "simpleupset"
version = "0.1.4"
description = "UpSet plots with a simple interface: pass a dict of sets, get a plot."
readme = "README.md"
authors = [
    { name = "claude", email = "claude@paulsaary.de" }
]
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=2.3.3",
    "pytest>=8",
]
docs = [
    "furo>=2025.12.19",
    "pandas>=2.3.3",
    "sphinx>=8.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
