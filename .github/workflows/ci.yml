name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
        env:
          # baselines match the matplotlib locked for 3.12; elsewhere they may skip
          REQUIRE_IMAGE_TESTS: ${{ matrix.python-version == '3.12' && '1' || '' }}
      - name: Upload image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-results-${{ matrix.python-version }}
          path: tests/image_results/
          if-no-files-found: ignore

  test-without-pandas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (no pandas)
        run: |
          uv sync --locked
          uv pip uninstall pandas
      - name: Test
        run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
